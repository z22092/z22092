# Scheduled workflows are auto-disabled after 60 days without repository activity;
# the final step re-enables this one on every run so the weekly refresh keeps going.
name: Refresh card

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-card
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"

      - name: Build assets
        run: uv run scripts/build_assets.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit changes
        run: |
          if git diff --quiet -- assets/; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "chore: refresh taskiq-postgresql card"
          git push

      - name: Keep the schedule enabled
        if: always()
        run: gh workflow enable refresh-card.yml
        env:
          GH_TOKEN: ${{ github.token }}
